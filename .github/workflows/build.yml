# Builds and tests RackAttack Editor on GitHub's Macs at each push: no Mac tools needed
# locally. The AU, VST3 and app are in the "Artifacts" of each run (Actions tab).
name: build

on:
  push:
    branches: [ "**" ]
    paths-ignore: ["docs/**", "**.md", "site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          ART=build/RackAttackEditor_artefacts/Release
          mkdir -p pkg out
          for b in "AU/RackAttack Editor.component" "VST3/RackAttack Editor.vst3" "Standalone/RackAttack Editor.app"; do
            codesign --force --deep --sign - "$ART/$b"
            cp -R "$ART/$b" pkg/
          done
          ditto -c -k pkg out/RackAttack-Editor-mac.zip
          # the disk image with its installer, as the release makes it (to catch problems before a release)
          VER=$(sed -n 's/^project(RackAttack VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          python3 -m pip install --quiet --break-system-packages dmgbuild==1.6.7 || python3 -m pip install --quiet dmgbuild==1.6.7
          tools/dmg/make_dmg.sh pkg out/RackAttack-Editor-mac.dmg "$VER"
      - uses: actions/upload-artifact@v4
        with:
          name: RackAttack-Editor-mac
          path: |
            out/RackAttack-Editor-mac.zip
            out/RackAttack-Editor-mac.dmg
